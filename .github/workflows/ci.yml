name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:coverage
      - run: bun run build
      - run: bun run test:package
      - run: npm pack --dry-run
      - run: bun audit --production

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            docs/package-lock.json
            shared/package-lock.json
      - run: npm ci --prefix ../shared
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run build
      - run: npx playwright install chromium
        timeout-minutes: 5
      - run: npm run test:browser
      - run: npm audit --audit-level=high

  # Browser suites run on parallel runners: the landing examples spec (about
  # half of the landing time), the rest of landing, and the combined docs suite.
  # Chromium is installed without --with-deps: the runner already has its system
  # libraries and apt only added fallback fonts, which once took ten minutes on a
  # throttled mirror.
  landing:
    name: landing (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [examples, site, docs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            landing/package-lock.json
            docs/package-lock.json
            shared/package-lock.json
      - run: npm ci --prefix shared
      - run: npm ci --prefix landing
      - run: npm ci --prefix docs
      - if: matrix.suite == 'site'
        run: npm run landing:check
      - if: matrix.suite == 'site'
        run: npm --prefix landing run format:check
      - run: npm run site:build
      - run: npm exec --prefix landing -- playwright install chromium
        timeout-minutes: 5
      - if: matrix.suite != 'docs'
        run: npm --prefix landing run test:browser -- --project=${{ matrix.suite }}
      - if: matrix.suite == 'docs'
        run: npm run site:test:browser
