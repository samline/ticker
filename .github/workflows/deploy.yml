name: Deploy landing and docs to GitHub Pages

on:
  push:
    branches: [main]
    # Skip deploys for changes that cannot alter the built site (tests, CI,
    # maintenance notes). Package source, root README/CHANGELOG and skills feed
    # the site, so they still deploy.
    paths-ignore:
      - '.github/workflows/ci.yml'
      - '.github/workflows/site.yml'
      - '.agents/**'
      - '**/AGENTS.md'
      - 'landing/README.md'
      - 'docs/README.md'
      - 'shared/README.md'
      - 'docs/CONTENT-AUDIT.md'
      - 'tests/**'
      - 'landing/tests/**'
      - 'landing/e2e/**'
      - 'docs/e2e/**'
      - '**/playwright*.config.ts'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - name: Build landing, examples and docs and verify links
        run: bun run site:build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: landing/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
