# The website's own checks (not managed by the family template).
# pnpm installs, Bun runs the scripts.
name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Browser suites run on parallel runners: the landing examples spec (about
  # half of the landing time), the rest of landing, and the combined docs suite.
  # Chromium is installed without --with-deps: the runner already has its system
  # libraries and apt only added fallback fonts, which once took ten minutes on a
  # throttled mirror.
  website:
    name: website (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [examples, site, docs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - if: matrix.suite == 'site'
        run: pnpm audit
      - if: matrix.suite == 'site'
        name: Verify package exports and contents
        run: bun run build && bun run test:package
      - if: matrix.suite == 'site'
        name: Check both apps and their formatting
        run: |
          bun run landing:check
          bun run --cwd landing format:check
          bun run docs:check
          bun run --cwd docs format:check
      - name: Build site and verify links
        run: bun run site:build
      - run: pnpm --dir landing exec playwright install chromium
        timeout-minutes: 5
      - if: matrix.suite != 'docs'
        run: bun run --cwd landing test:browser -- --project=${{ matrix.suite }}
      - if: matrix.suite == 'docs'
        run: bun run site:test:browser
